  title: "Gut bacterial metabolites and traumatic brain injury"
  category: "Network pharmacology"
  filter: "network"
  summary: "Integrated gut bacterial metabolites with traumatic-brain-injury targets, identifying 36 overlapping targets and TNF as a central network hub. Butyrate was assessed as a potential binding candidate."

- id: abutilon-gonorrhoeae
  title: "Plant-derived compounds against drug-resistant Neisseria gonorrhoeae"
  category: "Computational drug discovery"
  filter: "discovery"
  summary: "Modeled the FtsY protein and virtually screened compounds from Abutilon theophrasti. Chrysoeriol emerged as a candidate with favorable predicted properties and a docking score of −6.9 kcal/mol."