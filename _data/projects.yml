- id: covid-transcriptomics
  title: "Gene modules and regulatory networks in COVID-19"
  category: "Transcriptomics"
  filter: "genomics"
  summary: "Used WGCNA to map relationships between gene modules and COVID-19 traits, then applied machine-learning classification to shortlist two candidate genes."

