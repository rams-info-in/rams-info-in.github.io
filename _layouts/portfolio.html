<!doctype html>
<html lang="{{ site.locale | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#eaf5f4">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body class="portfolio-body">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Abhiram S, home">
      <span class="brand-mark" aria-hidden="true">AS</span>
      <span class="brand-name">ABHIRAM S<small>BIOINFORMATICS</small></span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about/' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact/' %}aria-current="page"{% endif %}>Contact</a>
    </nav>
    <a class="header-contact" href="mailto:s.abhiramofficial@gmail.com">Let’s connect <span aria-hidden="true">↗</span></a>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>ABHIRAM S <span aria-hidden="true">·</span> BIOINFORMATICS</span>
    <span>Built around the questions biology leaves open.</span>
    <a href="https://github.com/rams-info-in" rel="me">GitHub ↗</a>
  </footer>

  <dialog class="site-dialog" id="site-dialog" aria-labelledby="dialog-title">
    <div class="dialog-glow" aria-hidden="true"></div>
    <div class="dialog-head">
      <p class="eyebrow" id="dialog-kicker">Research note</p>
      <button class="dialog-close" type="button" data-dialog-close aria-label="Close window">×</button>
    </div>
    <h2 id="dialog-title">Research area</h2>
    <p class="dialog-copy" id="dialog-copy"></p>
    <a class="dialog-link" id="dialog-link" href="{{ '/projects/' | relative_url }}">View research <span aria-hidden="true">↗</span></a>
  </dialog>

  <script src="{{ '/assets/js/portfolio.js' | relative_url }}" defer></script>
</body>
</html>
